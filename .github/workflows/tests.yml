name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline synthetic tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: ''
          ACP_M08_GUEST_PASSWORD: ''
        run: python -B -m unittest discover -s tests -v
